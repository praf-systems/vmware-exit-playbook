name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit and schema tests
        run: pytest -q

      - name: End-to-end run on sample data
        run: |
          exitplaybook-inventory --input samples/rvtools_vinfo_sample.csv --output runs/inventory.json
          exitplaybook-classify --inventory runs/inventory.json --tags samples/app_tags.csv --output runs/classified.json

      - name: Keep the pipeline output
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: runs/
          retention-days: 7
